<script>
/* Startup guard: if a script fails to load or throws before the site has started, say so
   on screen with a Reload button, rather than leaving a dark page. */
(function () {
  var shown = false, started = function () { return !!(window.TWIN && window.TWIN.router && window.TWIN.router.path); };
  function show(msg) {
    if (shown || started()) return;
    shown = true;
    var d = document.createElement('div');
    d.setAttribute('role', 'alert');
    d.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:999;max-width:760px;margin:0 auto;padding:14px 16px;border-radius:6px;background:#2a1215;border:1px solid #e5484d;color:#f3d6d7;font:14px/1.5 system-ui,sans-serif';
    d.innerHTML = '<b>The page could not start.</b> ' + String(msg).replace(/[<>&]/g, '') + ' <button type="button" style="margin-left:8px;padding:4px 10px;border-radius:4px;border:1px solid #e5484d;background:none;color:inherit;cursor:pointer">Reload</button>';
    d.querySelector('button').onclick = function () { location.reload(); };
    document.body.appendChild(d);
  }
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) show('A file did not load: ' + (t.src || t.href).replace(location.origin, '') + '. The local server may have dropped it.');
    else if (e.message) show(e.message);
  }, true);
  setTimeout(function () { if (!started()) show('Nothing had started after 25 seconds.'); }, 25000);
})();
</script>
